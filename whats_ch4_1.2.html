function pickFemaleVoice(){
  var voices = window.speechSynthesis.getVoices();
  if(!voices || !voices.length) return null;
  var en = voices.filter(function(v){ return /^en/i.test(v.lang); });
  var femaleRe = /female|woman|zira|samantha|karen|susan|victoria|allison|kate|serena|tessa|moira|fiona|jenny|aria|nova|sara|linda|amy|libby|monica|paulina|catherine|nancy|natasha/i;

      || voices.find(function(v){return femaleRe.test(v.name);})
      || en[0] || voices[0] || null;
}

/* ===== ARCADE AUDIO ENGINE (Web Audio API — synth + algorithmic reverb) ===== */
var A = {
  ctx:null, master:null, dry:null, verb:null, verbGain:null,
  init(){
    if(this.ctx) return;
    try{
      var AC = window.AudioContext||window.webkitAudioContext;
      this.ctx = new AC();
      this.master = this.ctx.createGain(); this.master.gain.value=0.9; this.master.connect(this.ctx.destination);
      this.dry = this.ctx.createGain(); this.dry.gain.value=1; this.dry.connect(this.master);
      this.verb = this.ctx.createConvolver(); this.verb.buffer = this.impulse(2.0,2.6);
      this.verbGain = this.ctx.createGain(); this.verbGain.gain.value=0.30;
      this.verb.connect(this.verbGain); this.verbGain.connect(this.master);
    }catch(e){}
  },
  impulse(dur,decay){
    var rate=this.ctx.sampleRate, len=Math.floor(rate*dur), buf=this.ctx.createBuffer(2,len,rate);
    for(var c=0;c<2;c++){ var d=buf.getChannelData(c); for(var i=0;i<len;i++){ d[i]=(Math.random()*2-1)*Math.pow(1-i/len,decay); } }
    return buf;
  },
  tone(o){
    if(!this.ctx) return;
    var ctx=this.ctx, t0=ctx.currentTime+(o.t0||0), dur=o.dur||.2, atk=o.atk!=null?o.atk:.007, vol=o.vol!=null?o.vol:.2;
    var osc=ctx.createOscillator(); osc.type=o.type||'sine'; osc.frequency.setValueAtTime(o.freq,t0);
    var g=ctx.createGain();
    g.gain.setValueAtTime(0,t0);
    g.gain.linearRampToValueAtTime(vol,t0+atk);
    g.gain.exponentialRampToValueAtTime(0.0001,t0+atk+dur);
    osc.connect(g); g.connect(this.dry);
    if(o.wet!==false && this.verb){ var wg=ctx.createGain(); wg.gain.value=(o.wetAmt!=null?o.wetAmt:.45); g.connect(wg); wg.connect(this.verb); }
    osc.start(t0); osc.stop(t0+atk+dur+.05);
  },
  noise(o){
    if(!this.ctx) return;
    var ctx=this.ctx, t0=ctx.currentTime+(o.t0||0), dur=o.dur||.15;
    var n=Math.max(1,Math.floor(ctx.sampleRate*dur)), buf=ctx.createBuffer(1,n,ctx.sampleRate), d=buf.getChannelData(0);
    for(var i=0;i<n;i++) d[i]=Math.random()*2-1;
    var src=ctx.createBufferSource(); src.buffer=buf;
    var filt=ctx.createBiquadFilter(); filt.type=o.hp?'highpass':'lowpass'; filt.frequency.value=o.hp||o.lp||1200;
    var g=ctx.createGain(); var vol=o.vol!=null?o.vol:.14;
    g.gain.setValueAtTime(vol,t0); g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
    src.connect(filt); filt.connect(g); g.connect(this.dry);
    src.start(t0); src.stop(t0+dur);
  }
};

/* ===== CONFETTI / FIREWORKS CANVAS ===== */
var FX = {
  canvas:null, ctx:null, parts:[], started:false,
  ensure(){
    if(this.canvas) return;
    var c=document.createElement('canvas');
    c.style.cssText='position:fixed;inset:0;pointer-events:none;z-index:9999;';
    document.body.appendChild(c); this.canvas=c; this.ctx=c.getContext('2d');
    if(!this.ctx) return;
    this.resize();
    window.addEventListener('resize', this.resize.bind(this));
    if(!this.started){ this.started=true; this.loop(); }
  },
  resize(){
    if(!this.ctx) return;
    var dpr=Math.min(window.devicePixelRatio||1,2);
    this.canvas.width=innerWidth*dpr; this.canvas.height=innerHeight*dpr;
    this.canvas.style.width=innerWidth+'px'; this.canvas.style.height=innerHeight+'px';
    this.ctx.setTransform(dpr,0,0,dpr,0,0);
  },
  burst(kind){
    this.ensure();
    var W=innerWidth;
    var colors=['#f59e0b','#10b981','#3b82f6','#ef4444','#a78bfa','#fbbf24','#22d3ee','#fb7185'];
    var n = kind==='grand' ? 170 : 80;
    for(var i=0;i<n;i++){
      var x = kind==='grand' ? Math.random()*W : W*(.12+Math.random()*.76);
      this.parts.push({
        x:x, y:-20-Math.random()*140, vx:(Math.random()-.5)*3, vy:2+Math.random()*3,
        rot:Math.random()*360, vr:(Math.random()-.5)*16, size:5+Math.random()*5,
        color:colors[i%colors.length], life:0, maxLife:160+Math.random()*70,
        shape: Math.random()<.5?'rect':'circle', grav:.06
      });
    }
    if(kind==='grand'){
      var self=this;
      [0,480,960].forEach(function(delay){ setTimeout(function(){ self.firework(); }, delay); });
    }
  },
  firework(){
    var W=innerWidth,H=innerHeight;
    var x=W*(.18+Math.random()*.64), y=H*(.14+Math.random()*.28);
    var colors=['#fbbf24','#10b981','#22d3ee','#f43f5e','#a78bfa','#fde047'];
    for(var i=0;i<55;i++){
      var ang=Math.random()*Math.PI*2, sp=2+Math.random()*5;
      this.parts.push({ x:x,y:y, vx:Math.cos(ang)*sp, vy:Math.sin(ang)*sp, rot:0, vr:0, size:3+Math.random()*3, color:colors[i%colors.length], life:0, maxLife:70+Math.random()*30, shape:'circle', grav:.045 });
    }
    SFX.coin();
  },
  loop(){
    var ctx=this.ctx;
    if(ctx){
      ctx.clearRect(0,0,innerWidth,innerHeight);
      for(var i=this.parts.length-1;i>=0;i--){
        var p=this.parts[i];
        p.vy += p.grav;
        p.x+=p.vx; p.y+=p.vy; p.rot+=p.vr; p.life++;
        var alpha = 1-(p.life/p.maxLife);
        if(p.life>=p.maxLife || p.y>innerHeight+50 || alpha<=0){ this.parts.splice(i,1); continue; }
        ctx.save(); ctx.globalAlpha=Math.max(alpha,0); ctx.translate(p.x,p.y); ctx.rotate(p.rot*Math.PI/180);
        ctx.fillStyle=p.color;
        if(p.shape==='circle'){ ctx.beginPath(); ctx.arc(0,0,p.size,0,Math.PI*2); ctx.fill(); }
        else{ ctx.fillRect(-p.size/2,-p.size*.35,p.size,p.size*.7); }
        ctx.restore();
      }
    }
    requestAnimationFrame(this.loop.bind(this));
  }
};

function enterStage(stage){ stopStage(); app.curStage=stage; app.stageStart=Date.now(); }

function fmtDateTime(d){ d=d||new Date(); var p=function(n){return (n<10?'0':'')+n;}; return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+' '+p(d.getHours())+':'+p(d.getMinutes()); }
function shuffleArr(arr){
  var a = arr.slice();
  for(var i=a.length-1;i>0;i--){
    var j = Math.floor(Math.random()*(i+1));
    var t = a[i]; a[i]=a[j]; a[j]=t;
  }
  return a;
}

function submitToSheet(payload, btnEl, statusEl, onSuccess){
  if(!DATA.sheetUrl){ if(statusEl) statusEl.textContent='⚠️ 이 앱에는 구글시트 연동이 설정되어 있지 않습니다.'; return; }
  if(btnEl) btnEl.disabled = true;
  if(statusEl) statusEl.textContent='저장 중...';
  fetch(DATA.sheetUrl, { method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body: JSON.stringify(payload) })
    .then(function(){ if(statusEl) statusEl.textContent='✅ 저장 완료 ('+fmtDateTime(new Date())+')'; if(btnEl) btnEl.disabled=false; if(onSuccess) onSuccess(); })
    .catch(function(){ if(statusEl) statusEl.textContent='❌ 저장 실패 — 네트워크를 확인하고 다시 눌러주세요.'; if(btnEl) btnEl.disabled=false; });
}
function submitStageResult(stage, includeAdv){
  var btnEl = $(stage==='basic' ? '#basicSubmitResult' : '#advSubmitResult');
  var statusEl = $(stage==='basic' ? '#basicSubmitStatus' : '#advSubmitStatus');
  if(app[stage+'Submitted']){
    if(statusEl) statusEl.textContent = '✅ 이미 제출됐어요!';
    return;
  }
  submitToSheet(buildSubmitPayload(includeAdv), btnEl, statusEl, function(){ app[stage+'Submitted'] = true; });
}
function buildSubmitPayload(includeAdv){
  var basicTotal = DATA.basicQ.length;
  var basicPct = basicTotal ? Math.round(app.basicScore/basicTotal*100) : 0;
  var payload = {
    '이름': app.studentName, '학년': app.studentGrade, '테스트명': DATA.title,
    '날짜시각': fmtDateTime(app.testStartTime||new Date()),
    '플래쉬카드시간': fmtTime(app.times.card),
    '기본달성': app.basicScore+'/'+basicTotal, '기본%': basicPct,
    '기본오답재도전': (app.basicRetryScore||0)+'/'+(app.basicRetryTotal||0),
    '기본시간': fmtTime(app.times.basic),
    '심화달성':'', '심화%':'', '심화오답재도전':'', '심화시간':'',
    '총공부시간': fmtTime(app.times.card+app.times.basic+app.times.adv)
  };
  if(includeAdv){
    var advTotal = DATA.advQ.length;
    var advPct = advTotal ? Math.round(app.advScore/advTotal*100) : 0;
    payload['심화달성'] = app.advScore+'/'+advTotal;
    payload['심화%'] = advPct;
    payload['심화오답재도전'] = (app.advRetryScore||0)+'/'+(app.advRetryTotal||0);
    payload['심화시간'] = fmtTime(app.times.adv);
  }
  return payload;
}

    + '<button class="btn" id="advSubmit">제출</button></div>';
}
function normalizeAnswer(s){ return String(s||'').toLowerCase().replace(/\s+/g,' ').trim(); }
function renderWordAnswerHtml(answer){
  var words = String(answer||'').trim().split(/\s+/).filter(Boolean);
  return words.map(function(w,wi){
    var isSingle = w.length<=1;
    if(isSingle){
      return '<span class="word-group single-letter" data-first="">'
        + '<input type="text" class="rest-input" data-wi="'+wi+'" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" style="width:2.2em;text-align:center;">'
        + '</span>';
    }
    var first = w.charAt(0);
    return '<span class="word-group" data-first="'+esc(first)+'">'
      + '<span class="first-letter">'+esc(first)+'</span>'
      + '<input type="text" class="rest-input" data-wi="'+wi+'" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">'
      + '</span>';
  }).join(' ');
}
function wireWordInputs(container){
  var inputs = Array.prototype.slice.call(container.querySelectorAll('.rest-input'));
  inputs.forEach(function(inp,i){
    inp.addEventListener('input', function(){ inp.value=(inp.value||'').toLowerCase().replace(/[^a-z'\-]/g,''); });
    inp.addEventListener('keydown', function(e){
      if(e.key==='Enter'){ e.preventDefault(); var next=inputs[i+1]; if(next) next.focus(); else submitAdv(); }
      else if(e.key==='Backspace' && !inp.value && i>0){ e.preventDefault(); inputs[i-1].focus(); }
    });
  });
}
function collectWordAnswer(container){
  var groups = Array.prototype.slice.call(container.querySelectorAll('.word-group'));
  return groups.map(function(g){ var inp=g.querySelector('.rest-input'); return (g.getAttribute('data-first')||'')+(inp?inp.value:''); }).join(' ');
}
function anyWordEmpty(container){
  return Array.prototype.slice.call(container.querySelectorAll('.rest-input')).some(function(i){ return !i.value.trim(); });
}
function showMissPopup(word){
  A.init(); playSnd('advWrong');
  var old=document.querySelector('.miss-popup'); if(old) old.remove();
  var el=document.createElement('div'); el.className='miss-popup';
  el.innerHTML='<div class="miss-popup-card"><div class="miss-popup-siren">\ud83d\ude31</div><div class="miss-popup-label">정답은</div><div class="miss-popup-word">'+esc(word)+'</div></div>';
  document.body.appendChild(el);
  setTimeout(function(){ el.classList.add('show'); },10);
  setTimeout(function(){ el.classList.remove('show'); setTimeout(function(){ el.remove(); },300); }, 1750);
}
function pickChoice(el){
  if(app.basicPicked!=null) return;
  A.init();
  var qs=app.basicPool, q=qs[app.basicIdx];
  var o=el.getAttribute('data-opt'); app.basicPicked=o;
  var ok = (o===q.answer);
  if(ok){ app.basicScore++; playSnd('basicCorrect'); } else { playSnd('basicWrong'); app.basicWrongItems.push(q); }
  render();
  var qc=document.querySelector('.quiz-card'); if(qc) qc.classList.add(ok?'bounce-correct':'shake');
  setTimeout(advanceBasic, ok?900:1300);
}
function advanceBasic(){
  app.basicPicked=null;
  var qs=app.basicPool;
  if(app.basicIdx+1<qs.length){ app.basicIdx++; render(); return; }
  app.basicDone=true; stopStage();
  var pct = qs.length ? Math.round(app.basicScore/qs.length*100) : 0;
  if(app.basicReview){ app.basicRetryScore=app.basicScore; app.basicRetryTotal=qs.length; }
  var autoSubmit = (pct>=ACH && !app.basicReview);
  if(autoSubmit){ app.basicPassed=true; setTimeout(function(){ celebrate('basic'); }, 200); }
  render();
  if(autoSubmit){
    submitStageResult('basic', false);
  }
}
function submitAdv(){
  if(app.advLocked) return;
  var container=$('#advAnswer'); if(!container) return;
  if(anyWordEmpty(container)) return;
  A.init();
  app.advLocked = true;
  var qs=app.advPool, it=qs[app.advIdx];
  var guess = normalizeAnswer(collectWordAnswer(container));
  var ans = normalizeAnswer(it.word);
  var ok = guess === ans;
  var words = it.word.trim().split(/\s+/);
  var groups = Array.prototype.slice.call(container.querySelectorAll('.word-group'));
  groups.forEach(function(g,i){
    var inp=g.querySelector('.rest-input');
    var combined=(g.getAttribute('data-first')||'')+(inp?inp.value:'');
    g.classList.add(normalizeAnswer(combined)===normalizeAnswer(words[i]||'') ? 'correct' : 'wrong');
    if(inp) inp.disabled=true;
  });
  var advSubmit=$('#advSubmit'); if(advSubmit) advSubmit.disabled=true;
  var qc=document.querySelector('.quiz-card');
  if(ok){
    app.advScore++; playSnd('advCorrect');
    if(qc) qc.classList.add('bounce-correct');
    setTimeout(function(){ app.advLocked=false; advanceAdv(); }, 900);
  } else {
    app.advWrongItems.push(it);
    if(qc) qc.classList.add('shake');
    var fb=$('#advFeedback'); if(fb) fb.innerHTML='<span class="no">오답 \u2014 정답: '+esc(it.word)+'</span>';
    showMissPopup(it.word);
    setTimeout(function(){ app.advLocked=false; advanceAdv(); }, 2000);
  }
}
function advanceAdv(){
  var qs=app.advPool;
  if(app.advIdx+1<qs.length){ app.advIdx++; render(); return; }
  app.advDone=true; stopStage();
  var pct = qs.length ? Math.round(app.advScore/qs.length*100) : 0;
  if(app.advReview){ app.advRetryScore=app.advScore; app.advRetryTotal=qs.length; }
  var autoSubmit = (pct>=ACH && !app.advReview);
  if(autoSubmit){ setTimeout(function(){ celebrate('grand'); }, 200); }
  render();
  if(autoSubmit){
    submitStageResult('adv', true);
  }
}
function wire(){
  var goCard=$('#goCard'); if(goCard) goCard.addEventListener('click', startCard);
  var goBasic=$('#goBasic'); if(goBasic) goBasic.addEventListener('click', startBasic);
  var goAdv=$('#goAdv'); if(goAdv) goAdv.addEventListener('click', startAdv);
  var toHome=$('#toHome'); if(toHome) toHome.addEventListener('click', function(){ SFX.click(); goHome(); });
  var basicHome=$('#basicHome'); if(basicHome) basicHome.addEventListener('click', function(){ SFX.click(); goHome(); });
  var advHome=$('#advHome'); if(advHome) advHome.addEventListener('click', function(){ SFX.click(); goHome(); });

  var studentName=$('#studentName');
  if(studentName) studentName.addEventListener('input', function(){
    app.studentName = studentName.value;
    var ready = studentInfoReady();
    ['#goCard','#goBasic'].forEach(function(sel){ var b=$(sel); if(b) b.disabled=!ready; });
    var goAdvBtn=$('#goAdv'); if(goAdvBtn) goAdvBtn.disabled = !(ready && app.basicPassed);
    var hint=$('.student-info-hint'); if(hint && ready) hint.remove();
  });
  var studentGrade=$('#studentGrade');
  if(studentGrade) studentGrade.addEventListener('change', function(){ app.studentGrade = studentGrade.value; render(); });

  var basicSubmitResult=$('#basicSubmitResult');
  if(basicSubmitResult) basicSubmitResult.addEventListener('click', function(){
    SFX.click();
    submitStageResult('basic', false);
  });
  var advSubmitResult=$('#advSubmitResult');
  if(advSubmitResult) advSubmitResult.addEventListener('click', function(){
    SFX.click();
    submitStageResult('adv', true);
  });

  var fc=$('#fcCard'); if(fc) fc.addEventListener('click',function(){A.init();app.flipped=!app.flipped;fc.classList.toggle('flip');SFX.flip();if(app.flipped)speak(DATA.words[app.cardIdx].ex.en);});
  var fcSpeak=$('#fcSpeak'); if(fcSpeak) fcSpeak.addEventListener('click',function(e){e.stopPropagation();speak(DATA.words[app.cardIdx].w);});
  document.querySelectorAll('[data-speak]').forEach(function(el){el.addEventListener('click',function(e){e.stopPropagation();speak(el.getAttribute('data-speak'));});});
  var cPrev=$('#cPrev'); if(cPrev) cPrev.addEventListener('click',function(){SFX.click();app.cardIdx=(app.cardIdx-1+DATA.words.length)%DATA.words.length;app.flipped=false;render();});
  var cNext=$('#cNext'); if(cNext) cNext.addEventListener('click',function(){SFX.click();app.cardIdx=(app.cardIdx+1)%DATA.words.length;app.flipped=false;render();});

  document.querySelectorAll('#basicOpts .choice').forEach(function(el){el.addEventListener('click',function(){ pickChoice(el); });});
  var bRestart=$('#basicRestart'); if(bRestart) bRestart.addEventListener('click', startBasic);
  var bRetryWrong=$('#basicRetryWrong'); if(bRetryWrong) bRetryWrong.addEventListener('click', startBasicReview);

  var advAnswer=$('#advAnswer');
  if(advAnswer){
    wireWordInputs(advAnswer);
    var firstInput=advAnswer.querySelector('.rest-input');
    if(firstInput) setTimeout(function(){ firstInput.focus(); }, 60);
  }
  var advSubmit=$('#advSubmit'); if(advSubmit) advSubmit.addEventListener('click', submitAdv);
  var advHint=$('#advHint'); if(advHint) advHint.addEventListener('click', function(){
    var qs=app.advPool||DATA.advQ; var it=qs[app.advIdx];
    if(it) speak(it.word);
  });
  var advRestart=$('#advRestart'); if(advRestart) advRestart.addEventListener('click', startAdv);
  var advRetryWrong=$('#advRetryWrong'); if(advRetryWrong) advRetryWrong.addEventListener('click', startAdvReview);
}
render();
</script>
</body></html>
